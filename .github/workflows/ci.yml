name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: write   # só para o passo que commita o package-lock.json na primeira vez

jobs:
  app:
    name: lint, tipos, testes e build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          # Quando o package-lock.json existir, acrescente aqui:  cache: npm
      - name: Instalar (npm ci se houver lockfile; senão npm install)
        id: install
        run: |
          if [ -f package-lock.json ]; then
            echo "had_lock=true" >> "$GITHUB_OUTPUT"
            npm ci
          else
            echo "had_lock=false" >> "$GITHUB_OUTPUT"
            npm install
          fi
      - name: Versionar o package-lock.json gerado (só na primeira vez, só em main)
        if: steps.install.outputs.had_lock == 'false' && github.ref == 'refs/heads/main'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "Adiciona package-lock.json (gerado pelo CI na primeira instalação)"
          git push
      - name: Versões resolvidas (aparecem nas anotações da execução)
        run: |
          echo "::notice title=versoes::$(npm ls --depth=0 2>&1 | tr '\n' ' ')"
          echo "::notice title=node::$(node --version) npm $(npm --version)"
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - name: Build de produção (o build não usa o Supabase)
        run: npm run build
        env:
          NEXT_PUBLIC_APP_URL: http://localhost:3000

  db:
    name: migrações e testes SQL (Postgres descartável)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - name: Rodar test:db (banco criado só para o teste)
        run: bash scripts/db-test.sh
        env:
          PGHOST: localhost
          PGPORT: "5432"
          PGUSER: postgres
          PGPASSWORD: postgres
          DB_TEST_NAME: bolonha_test
